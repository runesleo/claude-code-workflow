name: OPC Lab

on:
  pull_request:
    paths:
      - 'labs/opc-company/**'
      - 'scripts/verify.sh'
      - 'README.md'
      - 'README.en.md'
      - '.github/workflows/opc-lab.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify QuietHarness repository
        run: ./scripts/verify.sh
      - name: Verify OPC fixtures
        run: python3 labs/opc-company/tests/run.py
      - name: Parse OPC JSON
        run: |
          find labs/opc-company -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done
      - name: Reject private or production identifiers
        run: |
          hits="$(grep -REn '(/(Users|home)/[^/]+|leo[-]vault|_[i]nventory|active[-]tasks|T[0-9]{3,}|thread[_ -]?id|session[_ -]?id|0x[a-fA-F0-9]{40})' labs/opc-company 2>/dev/null || true)"
          if [ -n "$hits" ]; then
            echo 'OPC_VERIFY_FAIL private or production pattern detected' >&2
            echo "$hits" >&2
            exit 1
          fi
          echo OPC_PRIVATE_SCAN_OK
