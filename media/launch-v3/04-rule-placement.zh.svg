    <circle cx="124" cy="491" r="8" fill="#B8F34A"/><text x="154" y="501" fill="#F4F7F8" font-size="29">安全迁移工具</text>
    <text x="154" y="534" fill="#9EABB8" font-size="21">inventory · dry-run · backup · rollback</text>
    <circle cx="124" cy="587" r="8" fill="#B8F34A"/><text x="154" y="597" fill="#F4F7F8" font-size="29">九条业务线与任务系统</text>
    <text x="154" y="630" fill="#9EABB8" font-size="21">Owner · Worker · readout · writeback · lock</text>
    <circle cx="124" cy="665" r="8" fill="#B8F34A"/><text x="154" y="675" fill="#F4F7F8" font-size="29">已有开源分支的完整地图</text>

    <rect x="840" y="278" width="688" height="420" rx="32" fill="#21171D" stroke="#61303E"/>
    <text x="878" y="334" fill="#FF8EA0" font-size="26" font-weight="700">STAYS PRIVATE · 我的实时运行态</text>
    <circle cx="892" cy="395" r="8" fill="#FF8EA0"/><text x="922" y="405" fill="#F4F7F8" font-size="29">当前任务、优先级与聊天记录</text>
    <circle cx="892" cy="475" r="8" fill="#FF8EA0"/><text x="922" y="485" fill="#F4F7F8" font-size="29">thread ID、本机路径与账号</text>
    <circle cx="892" cy="555" r="8" fill="#FF8EA0"/><text x="922" y="565" fill="#F4F7F8" font-size="29">仓位、健康、客户与凭证</text>
    <circle cx="892" cy="635" r="8" fill="#FF8EA0"/><text x="922" y="645" fill="#F4F7F8" font-size="29">scheduler、生产与公开动作</text>

    <rect x="72" y="746" width="1456" height="92" rx="26" fill="#10161D" stroke="#273442"/>
    <text x="108" y="802" fill="#F4F7F8" font-size="28">公开的不是匿名模板，而是可 fork 的真实结构。</text>
    <text x="1490" y="802" fill="#B8F34A" font-size="28" font-weight="700" text-anchor="end">三端常驻模板合计 2,292 B</text>
