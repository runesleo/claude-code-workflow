    <text x="76" y="220" fill="#9EABB8" font-size="27">保留我的架构与取舍，只拿掉实时数据和生产控制面。</text>

    <rect x="72" y="278" width="688" height="420" rx="32" fill="#152115" stroke="#426634"/>
