<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#080B0E"/>
  <g font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="72" y="70" fill="#B8F34A" font-size="24">Q U I E T H A R N E S S</text>
    <text x="1528" y="70" fill="#71808E" font-size="25" text-anchor="end">01 / 04</text>

    <text x="72" y="166" fill="#F4F7F8" font-size="64" font-weight="700">瘦身以后，连续性怎么办？</text>
    <text x="76" y="220" fill="#9EABB8" font-size="27">删掉常驻状态，不等于删掉长期记忆。</text>

    <rect x="72" y="278" width="1456" height="370" rx="32" fill="#121922" stroke="#273442"/>
    <text x="108" y="334" fill="#FF8EA0" font-size="24" font-weight="700">状态移出热路径之后</text>

    <rect x="108" y="378" width="230" height="72" rx="22" fill="#251A22" stroke="#55303D"/>
    <text x="223" y="423" fill="#F4F7F8" font-size="27" text-anchor="middle">Morning / Today</text>
    <rect x="364" y="378" width="230" height="72" rx="22" fill="#251A22" stroke="#55303D"/>
    <text x="479" y="423" fill="#F4F7F8" font-size="27" text-anchor="middle">Memory</text>
    <rect x="620" y="378" width="230" height="72" rx="22" fill="#251A22" stroke="#55303D"/>
    <text x="735" y="423" fill="#F4F7F8" font-size="27" text-anchor="middle">任务状态</text>
    <path d="M875 414 H960" stroke="#71808E" stroke-width="2"/>
    <path d="M946 402 L960 414 L946 426" fill="none" stroke="#71808E" stroke-width="2"/>
    <text x="995" y="408" fill="#9EABB8" font-size="23">不再默认加载</text>
    <text x="995" y="440" fill="#F4F7F8" font-size="30" font-weight="650">跨项目 · 跨会话 · 多客户端</text>

    <text x="108" y="526" fill="#9EABB8" font-size="24">错误答案</text>
    <rect x="238" y="490" width="350" height="70" rx="22" fill="#2A171D" stroke="#713241"/>
    <text x="413" y="535" fill="#FF8EA0" font-size="28" text-anchor="middle">把所有状态塞回 Prompt</text>
    <text x="638" y="526" fill="#9EABB8" font-size="24">正确答案</text>
    <rect x="768" y="490" width="700" height="70" rx="22" fill="#182916" stroke="#426634"/>
    <text x="1118" y="535" fill="#B8F34A" font-size="28" font-weight="700" text-anchor="middle">建立有边界、可核验、可替换的连续性协议</text>

    <rect x="72" y="694" width="1456" height="102" rx="26" fill="#10161D" stroke="#273442"/>
    <text x="108" y="755" fill="#61D6FF" font-size="29" font-weight="700">默认 Core 不变</text>
    <text x="388" y="755" fill="#D5DCE2" font-size="27">复杂状态在需要时连接，用完就退出。</text>
    <text x="1492" y="755" fill="#B8F34A" font-size="25" text-anchor="end">轻量 ≠ 失忆</text>
  </g>
</svg>
