<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#080B0E"/>
  <g font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="72" y="70" fill="#B8F34A" font-size="24">Q U I E T H A R N E S S</text>
    <text x="1528" y="70" fill="#71808E" font-size="25" text-anchor="end">03 / 04</text>

    <text x="72" y="166" fill="#F4F7F8" font-size="62" font-weight="700">连续性靠协议，不靠全量 Memory</text>
    <text x="76" y="220" fill="#9EABB8" font-size="27">只读需要的事实，只写真实发生的变化。</text>

    <text x="72" y="300" fill="#61D6FF" font-size="23" font-weight="700">INTERACTIVE PATH</text>
    <rect x="72" y="332" width="208" height="92" rx="25" fill="#17222C" stroke="#31536A"/>
    <text x="176" y="387" fill="#F4F7F8" font-size="28" text-anchor="middle">当前请求</text>
    <path d="M292 378 H340" stroke="#71808E" stroke-width="2"/><path d="M326 366 L340 378 L326 390" fill="none" stroke="#71808E" stroke-width="2"/>

    <rect x="352" y="332" width="232" height="92" rx="25" fill="#142633" stroke="#347094"/>
    <text x="468" y="374" fill="#61D6FF" font-size="25" font-weight="700" text-anchor="middle">bounded readout</text>
    <text x="468" y="405" fill="#D5DCE2" font-size="19" text-anchor="middle">只读当前范围</text>
    <path d="M596 378 H644" stroke="#71808E" stroke-width="2"/><path d="M630 366 L644 378 L630 390" fill="none" stroke="#71808E" stroke-width="2"/>

    <rect x="656" y="332" width="202" height="92" rx="25" fill="#292217" stroke="#785C31"/>
    <text x="757" y="374" fill="#FFC56E" font-size="25" font-weight="700" text-anchor="middle">freshness</text>
    <text x="757" y="405" fill="#D5DCE2" font-size="19" text-anchor="middle">缺失 / 过期 = UNKNOWN</text>
    <path d="M870 378 H918" stroke="#71808E" stroke-width="2"/><path d="M904 366 L918 378 L904 390" fill="none" stroke="#71808E" stroke-width="2"/>

    <rect x="930" y="332" width="206" height="92" rx="25" fill="#182719" stroke="#426634"/>
    <text x="1033" y="374" fill="#B8F34A" font-size="25" font-weight="700" text-anchor="middle">执行 + 验证</text>
    <text x="1033" y="405" fill="#D5DCE2" font-size="19" text-anchor="middle">只做当前任务</text>
    <path d="M1148 378 H1196" stroke="#71808E" stroke-width="2"/><path d="M1182 366 L1196 378 L1182 390" fill="none" stroke="#71808E" stroke-width="2"/>

    <rect x="1208" y="332" width="320" height="92" rx="25" fill="#251A22" stroke="#713241"/>
    <text x="1368" y="374" fill="#FF8EA0" font-size="25" font-weight="700" text-anchor="middle">change-time writeback</text>
    <text x="1368" y="405" fill="#D5DCE2" font-size="19" text-anchor="middle">变化发生时立即落盘</text>

    <path d="M1368 436 V498" stroke="#71808E" stroke-width="2"/>
    <path d="M1356 484 L1368 498 L1380 484" fill="none" stroke="#71808E" stroke-width="2"/>
    <rect x="1054" y="510" width="474" height="82" rx="24" fill="#151B21" stroke="#37424C"/>
    <text x="1090" y="546" fill="#9EABB8" font-size="20">receipt</text>
    <text x="1090" y="575" fill="#F4F7F8" font-size="24">来源 · 时间 · 改动 · 验证证据</text>

    <rect x="72" y="506" width="844" height="196" rx="30" fill="#11171D" stroke="#273442"/>
    <text x="108" y="558" fill="#B8F34A" font-size="24" font-weight="700">OWNER / WORKER 边界</text>
    <text x="108" y="608" fill="#F4F7F8" font-size="29">Worker 交付代码、报告或 receipt</text>
    <text x="108" y="651" fill="#F4F7F8" font-size="29">Owner 接受后，才成为任务事实</text>
    <text x="108" y="684" fill="#9EABB8" font-size="21">模型说“完成了” ≠ 状态已经持久化</text>

    <rect x="72" y="752" width="1456" height="80" rx="24" fill="#10161D"/>
    <text x="108" y="802" fill="#61D6FF" font-size="27" font-weight="700">readout</text>
    <text x="300" y="802" fill="#71808E" font-size="27">→</text>
    <text x="364" y="802" fill="#FFC56E" font-size="27" font-weight="700">freshness</text>
    <text x="574" y="802" fill="#71808E" font-size="27">→</text>
    <text x="638" y="802" fill="#FF8EA0" font-size="27" font-weight="700">writeback</text>
    <text x="851" y="802" fill="#71808E" font-size="27">→</text>
    <text x="915" y="802" fill="#B8F34A" font-size="27" font-weight="700">receipt</text>
    <text x="1490" y="802" fill="#F4F7F8" font-size="26" text-anchor="end">连续，但不常驻</text>
  </g>
</svg>
